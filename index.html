function parseLocalDate(ds){const[y,m,d]=ds.split('-').map(Number);const r=new Date(y,m-1,d);r.setHours(0,0,0,0);return r}
function toDS(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
const TODAY=new Date();TODAY.setHours(0,0,0,0);
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r}
function sameDay(a,b){return toDS(a)===toDS(b)}
function isWeekend(d){return d.getDay()===0||d.getDay()===6}
function mondayOf(d){const r=new Date(d);const day=r.getDay();const diff=day===0?-6:1-day;r.setDate(r.getDate()+diff);r.setHours(0,0,0,0);return r}
function diffDays(a,b){const ad=new Date(a);ad.setHours(0,0,0,0);const bd=new Date(b);bd.setHours(0,0,0,0);return Math.round((bd-ad)/(1000*60*60*24))}
function bizDate(n){let d=new Date(TODAY);let c=0;while(c<n){d.setDate(d.getDate()+1);if(!isWeekend(d))c++;}return toDS(d)}
function bizDaysAhead(t){let c=0;let d=new Date(TODAY);while(d<t){d.setDate(d.getDate()+1);if(!isWeekend(d))c++;}return c}
function toast(msg,dur=3000){const t=document.getElementById('toast');if(!t)return;t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),dur)}

// All bookings live server-side (see loadBookings/submitBooking below). This
// Formspree endpoint is only for the email notification when a client submits
// a request — the booking itself is already safely saved via /api/bookings
// before this ever fires, so a failed email never loses a booking.
const FORMSPREE_URL='https://formspree.io/f/xdaryral';

async function notifyByEmail(booking){
  const slotLabel=SLOTS.find(s=>s.id===booking.slot)?.label||booking.slot;
  const svcLabel=T.nl.serviceTypes.find(s=>s.value===booking.serviceType)?.label||booking.serviceType||'';
  await fetch(FORMSPREE_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json',Accept:'application/json'},
    body:JSON.stringify({
      _subject:`Nieuwe afspraak aanvraag — ${booking.ref||''}`,
      Referentie:booking.ref||'',
      Datum:booking.date,
      Tijdslot:slotLabel,
      Adres:booking.address,
      Contactpersoon:booking.contact||'-',
      Email:booking.email||'-',
      'Type service':svcLabel,
      'Aanvullende info':booking.additionalInfo||'-',
      Opmerkingen:booking.comments||'-',
    }),
  });
}

// browser — sees the same list. This is what makes the slot-conflict check
// actually work across different clients, and keeps a manager's blocked days
// visible to clients on other devices too.
const API_BASE='/api/bookings';
const HOLIDAYS_API_BASE='/api/holidays';

  lang:'nl',view:'client',tab:'agenda',holSubTab:'list',weekOffset:0,modal:null,
  managerUnlocked:false,showPwModal:false,pwError:false,

  get currentWeekMonday(){return addDays(mondayOf(TODAY),this.weekOffset*7)},
  get t(){return T[this.lang]},
};

function isHoliday(d){return APP.holidays.find(h=>h.date===toDS(d))}
const DOW_KEYS=['sun','mon','tue','wed','thu','fri','sat'];
const DEFAULT_RULES={mon:4,tue:2,wed:2,thu:2,fri:7};
function minNoticeDaysFor(date){
  const key=DOW_KEYS[date.getDay()];
  const rules=APP.rules||DEFAULT_RULES;
  const v=rules[key];
  return (typeof v==='number'&&v>=0)?v:(DEFAULT_RULES[key]??2);
}
function getSlotState(date,slotId,isClient){
  if(isWeekend(date)) return null;
  const t=APP.t;const hol=isHoliday(date);
  if(hol) return{type:'holiday',label:t.slotNa,icon:'🏖',reason:hol.name};
  const ds=toDS(date);
  if(isClient){
    const need=minNoticeDaysFor(date);
    if(diffDays(TODAY,date)<need){
      const dayLabel=t.weekdays[date.getDay()===0?6:date.getDay()-1];
      const reason=APP.lang==='nl'
        ?`${dayLabel}: min. ${need} ${need===1?'dag':'dagen'} van tevoren boeken`
        :`${dayLabel}: book at least ${need} ${need===1?'day':'days'} ahead`;
      return{type:'na',label:t.slotNa,icon:'⏰',reason};
    }
    if(date<mondayOf(TODAY)) return{type:'na',label:t.slotNa,icon:'⏰'};
    if(date>addDays(TODAY,31)) return{type:'na',label:t.slotNa,icon:'⏰'};
  }
  const booking=APP.bookings.find(b=>b.date===ds&&b.slot===slotId);
  if(booking){
    if(isClient) return{type:'na',label:t.slotNa,icon:'⏰'};
    return{type:booking.status,label:booking.status==='approved'?t.slotConfirmed:t.slotPending,icon:booking.status==='approved'?'✓':'⏳',booking};
  }
  if(slotId==='am2'&&APP.bookings.find(b=>b.date===ds&&b.slot==='am1')) return{type:'na',label:t.slotNa,icon:'⏰'};
  if(slotId==='am1'&&APP.bookings.find(b=>b.date===ds&&b.slot==='am2')) return{type:'na',label:t.slotNa,icon:'⏰'};
  return{type:'free',label:t.slotAvail,icon:'+'};
}
function managerCanOverride(date,slotId){
  if(isWeekend(date)||isHoliday(date)) return false;
  return !APP.bookings.find(b=>b.date===toDS(date)&&b.slot===slotId);
}
function weekHasFreeSlots(mon,isClient){
  const days=[0,1,2,3,4].map(i=>addDays(mon,i));
  for(const d of days){
    if(isWeekend(d)||isHoliday(d)) continue;
    const ds=toDS(d);
    const mb=APP.bookings.find(b=>b.date===ds&&(b.slot==='am1'||b.slot==='am2'));
    if(!mb){const a1=getSlotState(d,'am1',isClient);const a2=getSlotState(d,'am2',isClient);if((a1&&a1.type==='free')||(a2&&a2.type==='free'))return true;}
    const pm=getSlotState(d,'pm',isClient);if(pm&&pm.type==='free')return true;
  }
  return false;
}
function firstAvailClientOffset(){for(let o=0;o<=4;o++){if(weekHasFreeSlots(addDays(mondayOf(TODAY),o*7),true))return o;}return null}
function countWeekStats(days,isClient){
  let avail=0,approved=0,pending=0,total=0;
  days.forEach(d=>{
    if(isWeekend(d))return;const ds=toDS(d);
    const mb=APP.bookings.find(b=>b.date===ds&&(b.slot==='am1'||b.slot==='am2'));
    const a1=getSlotState(d,'am1',isClient);const a2=getSlotState(d,'am2',isClient);
    if(!isHoliday(d)){total++;if(!mb&&((a1&&a1.type==='free')||(a2&&a2.type==='free')))avail++;if(mb){if(mb.status==='approved')approved++;else pending++;}}
    const pm=getSlotState(d,'pm',isClient);
    if(pm){total++;if(pm.type==='free')avail++;if(pm.type==='approved')approved++;if(pm.type==='pending')pending++;}
  });
  return{avail,approved,pending,total};
}

        ${days.map(d=>{const hol=isHoliday(d);return`<div class="cal-head-cell ${sameDay(d,TODAY)?'today-col':''}"><div>${t.dayNames(d)}</div><div class="date-num">${d.getDate()}</div>${hol?`<div style="font-size:9px;color:rgba(255,200,200,0.9);margin-top:2px">🏖 ${t.closed}</div>`:''}</div>`;}).join('')}
      </div>
      <div class="cal-body">
        ${SLOTS.map(slot=>`<div style="display:contents">
          <div class="time-label">${slot.start.toString().padStart(2,'0')}:00</div>
          ${days.map(d=>{
            const st=getSlotState(d,slot.id,isClient);
            if(!st) return`<div class="slot-cell"></div>`;
            const ds=toDS(d);
            let cls,clickable=false,oc='';
            if(st.type==='free'){cls='slot-free';clickable=true;}
            else if(st.type==='approved'){cls='slot-approved';clickable=!isClient;}
            else if(st.type==='pending'){cls='slot-pending';clickable=!isClient;}
            else if(st.type==='holiday'){cls='slot-holiday';}
            else if(st.type==='na'){if(!isClient&&managerCanOverride(d,slot.id)){cls='slot-na-override';clickable=true;}else cls='slot-na';}
            if(clickable) oc=`onclick="slotClick('${ds}','${slot.id}')"`;
            return`<div class="slot-cell" ${oc}><div class="slot ${cls}">
              <div class="slot-time">${slot.label}</div>
              <div class="slot-status">${st.icon} ${st.label}</div>
              ${st.booking&&!isClient?`<div class="slot-addr">${st.booking.address||''}</div>`:''}
              ${!isClient&&st.type==='na'&&st.reason?`<div style="font-size:9px;opacity:0.7;margin-top:2px">${st.reason}</div>`:''}
            </div></div>`;
          }).join('')}
        </div>`).join('')}
      </div>
    </div>
    <div style="margin-top:10px;font-size:11px;color:var(--fv-text-light);text-align:right">${t.footerNote}</div>`;
}

function buildHolidays(){
  const t=APP.t;const st=APP.holSubTab;
  const tabs=`<div class="subtab-bar"><button class="subtab ${st==='cal'?'active':''}" onclick="setHolSubTab('cal')">${t.holCalTab}</button><button class="subtab ${st==='list'?'active':''}" onclick="setHolSubTab('list')">${t.holListTab}</button><button class="subtab ${st==='add'?'active':''}" onclick="setHolSubTab('add')">${t.holAddTab}</button></div>`;
  let content='';
  if(st==='list'){
    const sorted=[...APP.holidays].sort((a,b)=>a.date.localeCompare(b.date));
    content=`<table class="data-table"><thead><tr><th>${t.holDate}</th><th>${t.holDesc}</th><th>${t.holType}</th><th style="width:90px"></th></tr></thead><tbody>${sorted.map(h=>`<tr><td style="font-weight:700">${t.fmtDateLong(h.date)}</td><td>${h.name}</td><td>${h.type==='full'?t.holFullDay:t.holHalfDay}</td><td><button class="btn btn-sm btn-danger" onclick="deleteHoliday('${h.id}')">${t.holRemove}</button></td></tr>`).join('')}</tbody></table>`;
  } else if(st==='cal'){
    const y=TODAY.getFullYear(),m=TODAY.getMonth();
    const firstDay=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
    const mn=t.monthName(TODAY);
    const dh=t.weekdays.map(d=>`<div class="mini-cal-day-hd">${d}</div>`).join('');
    let cells='';const sp=firstDay===0?6:firstDay-1;
    for(let i=0;i<sp;i++) cells+=`<div class="mini-cal-day empty">.</div>`;
    for(let day=1;day<=dim;day++){const d=new Date(y,m,day);const ds=toDS(d);const hol=APP.holidays.find(h=>h.date===ds);cells+=`<div class="mini-cal-day ${sameDay(d,TODAY)?'today-d':''} ${hol?'blocked':''}" onclick="quickBlockDay('${ds}')">${day}</div>`;}
    content=`<div class="mini-cal"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px"><span style="font-size:13px;font-weight:700;text-transform:capitalize">${mn}</span><span style="font-size:11px;color:var(--fv-text-light)">${t.holBlockHint}</span></div><div class="mini-cal-grid">${dh}${cells}</div></div><button class="btn btn-primary btn-sm" onclick="addDutchHols()">${t.holAddDutch}</button>`;
  } else {
    content=`<div style="max-width:380px">
      <div class="form-group">
        <label class="form-label">${t.holRangeToggle}</label>
        <div style="display:flex;gap:16px;font-size:13px;margin-top:4px">
          <label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-weight:500"><input type="radio" name="hol-mode" value="single" checked onclick="toggleHolMode()">${t.holSingleDay}</label>
          <label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-weight:500"><input type="radio" name="hol-mode" value="range" onclick="toggleHolMode()">${t.holDateRange}</label>
        </div>
      </div>
      <div id="hol-single-fields">
        <div class="form-group"><label class="form-label">${t.blockDate}</label><input class="form-input" type="date" id="hol-date"/></div>
      </div>
      <div id="hol-range-fields" style="display:none">
        <div class="form-group"><label class="form-label">${t.holStartDate}</label><input class="form-input" type="date" id="hol-start-date"/></div>
        <div class="form-group"><label class="form-label">${t.holEndDate}</label><input class="form-input" type="date" id="hol-end-date"/></div>
      </div>
      <div class="form-group"><label class="form-label">${t.holDesc}</label><input class="form-input" type="text" id="hol-name" placeholder="${t.holNamePh}"/></div>
      <div class="form-group"><label class="form-label">${t.blockType}</label><select class="form-select" id="hol-type"><option value="full">${t.blockFull}</option><option value="half">${t.blockHalf}</option></select></div>
      <button class="btn btn-primary" onclick="addHoliday()">${t.holAddBtn}</button>
    </div>`;
  }
  return`<div class="section-header"><span class="section-title">${t.holSectionTitle}</span></div>${tabs}${content}`;
}

function buildModal(){
  const m=APP.modal;
  if(m.type==='manage') return buildManageModal(m);
  if(m.type==='book') return buildBookModal(m);
  if(m.type==='confirm') return buildConfirmModal(m);
  if(m.type==='quickblock') return buildQuickBlockModal(m);
  return'';
}
function modalShell(title,body,footer){
  return`<div class="modal-backdrop"><div class="modal"><div class="modal-header"><h3>${title}</h3><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div><div class="modal-footer">${footer}</div></div></div>`;
}
function buildManageModal(m){
  const t=APP.t;const b=m.booking,slot=SLOTS.find(s=>s.id===b.slot);
  const svcLabel=t.serviceTypes.find(s=>s.value===b.serviceType)?.label||b.serviceType||'—';
  const delStrip=m.confirmDelete?`<div class="delete-confirm"><span class="delete-confirm-text">${t.deleteConfirm}</span><div class="delete-confirm-btns"><button class="btn btn-sm btn-secondary" onclick="cancelDeleteBooking()">${t.cancel}</button><button class="btn btn-sm btn-danger" onclick="confirmDeleteBooking('${b.id}')">${t.yesDelete}</button></div></div>`:'';
  const rows=[[t.rowDate,t.fmtDateLong(b.date)],[t.rowSlot,slot.label],[t.rowAddr,b.address||'—'],[t.rowContact,b.contact||'—'],[t.rowEmail,b.email||'—'],[t.rowService,svcLabel],...(b.additionalInfo?[[t.rowAdditional,b.additionalInfo]]:[]),...(b.comments?[[t.rowComments,b.comments]]:[]),[t.rowStatus,`<span class="badge ${b.status==='approved'?'badge-green':'badge-amber'}">${b.status==='approved'?t.statusConfirmed:t.statusPending}</span>`]];
  const body=`${b.status==='approved'?`<div class="approved-banner">${t.approvedBanner}</div>`:''}${delStrip}<div class="booking-detail">${rows.map(([l,v])=>`<div class="booking-detail-row"><span class="lbl">${l}</span><span class="val">${v}</span></div>`).join('')}</div>`;
  const footer=`<button class="btn btn-secondary" onclick="closeModal()">${t.close}</button><button class="btn btn-danger btn-sm" onclick="askDeleteBooking()">${t.delete}</button>${b.status==='pending'?`<button class="btn btn-success" onclick="approveBooking('${b.id}')">${t.approve}</button>`:''}<button class="btn btn-primary btn-sm" onclick="showModal({type:'confirm',booking:APP.modal.booking})">${t.genConfirm}</button>`;
  return modalShell(t.manageTitle,body,footer);
}

    <div class="form-group"><label class="form-label">${t.labelContact}</label><input class="form-input" id="bk-contact" placeholder="${t.contactPh}"></div>
    <div class="form-group"><label class="form-label">${t.labelEmail}</label><input class="form-input" id="bk-email" type="email" placeholder="${t.emailPh}"></div>
    <div class="form-group"><label class="form-label">${t.labelService}</label><select class="form-select" id="bk-service" onchange="toggleAdditionalInfo()">${t.serviceTypes.map(s=>`<option value="${s.value}">${s.label}</option>`).join('')}</select></div>
    <div class="form-group additional-info" id="additional-info-group"><label class="form-label">${t.labelAdditional} <span style="color:var(--fv-red);font-size:10px">${t.additionalReq}</span></label><textarea class="form-textarea" id="bk-additional" placeholder="${t.additionalPh}"></textarea></div>
    <div class="form-group"><label class="form-label">${t.labelComments} <span style="font-weight:400;color:var(--fv-text-light);text-transform:none;letter-spacing:0">${t.commentsOpt}</span></label><textarea class="form-textarea" id="bk-comments" placeholder="${t.commentsPh}"></textarea></div>

    <div class="booking-detail">${rows.map(([l,v])=>`<div class="booking-detail-row"><span class="lbl">${l}</span><span class="val" style="${l===t.rowRef?'font-family:monospace;color:var(--fv-green)':''}">${v}</span></div>`).join('')}</div>`;

function buildQuickBlockModal(m){
  const t=APP.t;
  const body=`<div class="info-row">📅 ${t.fmtDateLong(m.date)}</div><div class="form-group"><label class="form-label">${t.blockDesc}</label><input class="form-input" id="qb-name" placeholder="${t.blockDescPh}"></div><div class="form-group"><label class="form-label">${t.blockType}</label><select class="form-select" id="qb-type"><option value="full">${t.blockFull}</option><option value="half">${t.blockHalf}</option></select></div>`;

function attachEvents(){
  window.setLang=l=>{APP.lang=l;render()};

  window.requestManagerView=()=>{
    if(APP.managerUnlocked){
      // Already unlocked — switch directly
      APP.view='manager';APP.tab='agenda';APP.modal=null;APP.weekOffset=0;render();
    } else {
      APP.showPwModal=true;APP.pwError=false;render();
      setTimeout(()=>document.getElementById('pw-input')?.focus(),50);
    }
  };

  window.checkPassword=()=>{
    const val=document.getElementById('pw-input')?.value||'';
    if(val===MANAGER_PASSWORD){
      APP.managerUnlocked=true;APP.showPwModal=false;APP.pwError=false;
      APP.view='manager';APP.tab='agenda';APP.modal=null;APP.weekOffset=0;
      render();
    } else {
      APP.pwError=true;render();
      setTimeout(()=>{
        const inp=document.getElementById('pw-input');
        if(inp){inp.focus();inp.select();}
      },50);
    }
  };

  window.cancelPw=()=>{APP.showPwModal=false;APP.pwError=false;render()};

  window.logoutManager=()=>{
    APP.managerUnlocked=false;APP.view='client';APP.tab='agenda';
    APP.modal=null;APP.weekOffset=firstAvailClientOffset()??0;render();
  };

  window.switchView=v=>{
    if(v==='manager'){window.requestManagerView();return;}
    APP.view='client';APP.tab='agenda';APP.modal=null;APP.weekOffset=firstAvailClientOffset()??0;render();
  };

  window.setTab=tb=>{APP.tab=tb;APP.modal=null;render()};
  window.changeWeek=n=>{if(APP.view==='client'){const nx=APP.weekOffset+n;if(nx<0||nx>4)return;APP.weekOffset=nx;}else APP.weekOffset+=n;render()};
  window.jumpToWeek=o=>{APP.weekOffset=o;render()};
  window.goToday=()=>{APP.weekOffset=0;render()};
  window.setHolSubTab=t=>{APP.holSubTab=t;render()};
  window.showModal=m=>{APP.modal=m;render()};
  window.closeModal=()=>{APP.modal=null;render()};
  window.toggleAdditionalInfo=()=>{const s=document.getElementById('bk-service');const g=document.getElementById('additional-info-group');if(!s||!g)return;s.value==='repair'?g.classList.add('visible'):g.classList.remove('visible')};

  window.slotClick=(ds,slotId)=>{
    const date=parseLocalDate(ds),isClient=APP.view==='client';
    const st=getSlotState(date,slotId,isClient);
    if(!st)return;
    if(st.type==='free'){APP.modal={type:'book',date:ds,slotId,override:false};render();}
    else if(st.type==='na'&&!isClient&&managerCanOverride(date,slotId)){APP.modal={type:'book',date:ds,slotId,override:true};render();}
    else if((st.type==='pending'||st.type==='approved')&&!isClient){APP.modal={type:'manage',booking:st.booking,confirmDelete:false};render();}
  };

  window.askDeleteBooking=()=>{APP.modal={...APP.modal,confirmDelete:true};render()};
  window.cancelDeleteBooking=()=>{APP.modal={...APP.modal,confirmDelete:false};render()};

  window.confirmDeleteBooking=async id=>{
    const prev=APP.bookings;
    APP.bookings=APP.bookings.filter(b=>b.id!==id);APP.modal=null;render();
    try{
      const res=await fetch(`${API_BASE}?id=${encodeURIComponent(id)}`,{method:'DELETE'});
      if(!res.ok)throw new Error('delete_failed');
      toast(APP.t.toastDeleted);
    }catch(e){
      APP.bookings=prev;render();
      toast(APP.lang==='nl'?'Verwijderen mislukt — probeer opnieuw.':'Delete failed — please try again.');
    }
  };

  window.approveBooking=async id=>{
    const b=APP.bookings.find(x=>x.id===id);
    if(!b)return;
    const prevStatus=b.status;
    b.status='approved';APP.modal={type:'manage',booking:b,confirmDelete:false};render();
    try{
      const res=await fetch(API_BASE,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
      if(!res.ok)throw new Error('approve_failed');
      toast(APP.t.toastApproved);
    }catch(e){
      b.status=prevStatus;APP.modal={type:'manage',booking:b,confirmDelete:false};render();
      toast(APP.lang==='nl'?'Bevestigen mislukt — probeer opnieuw.':'Confirm failed — please try again.');
    }
  };

  window.submitBooking=async(date,slotId,override)=>{
    const t=APP.t;
    const address=document.getElementById('bk-address').value.trim();
    const contact=document.getElementById('bk-contact').value.trim();
    const email=document.getElementById('bk-email').value.trim();
    const serviceType=document.getElementById('bk-service').value;
    const additionalInfo=document.getElementById('bk-additional')?.value.trim()||'';
    const comments=document.getElementById('bk-comments').value.trim();
    if(!address||!serviceType){toast(t.toastFillReq);return;}
    if(serviceType==='repair'&&!additionalInfo){toast(t.toastRepairReq);return;}
    const status=APP.view==='manager'?'approved':'pending';
    const btn=document.getElementById('bk-submit-btn');
    if(btn){btn.disabled=true;btn.textContent=t.sending;}
    try{
      const res=await fetch(API_BASE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date,slot:slotId,address,contact,email,serviceType,additionalInfo,comments,status,override:!!override})});
      if(res.status===409){
        // Someone else booked this exact slot in the meantime — refresh from the server and stop.
        await loadBookings();
        APP.modal=null;render();
        toast(APP.lang==='nl'?'Dit tijdslot is zojuist door iemand anders geboekt.':'This slot was just booked by someone else.',5000);
        return;
      }
      if(!res.ok)throw new Error('submit_failed');
      const created=await res.json();
      APP.bookings.push(created);
      APP.modal=null;render();
      toast(APP.view==='manager'?t.toastCreated:t.toastSubmitted,4000);
      // Best-effort — the booking is already safely saved above, so a Formspree
      // hiccup here (offline, quota, etc.) never causes a lost booking.
      if(APP.view!=='manager'){notifyByEmail(created).catch(()=>{});}
    }catch(e){
      if(btn){btn.disabled=false;btn.textContent=t.submitRequest;}
      toast(t.toastSubmitFail);
    }
  };

  window.saveRules=async()=>{
    const t=APP.t;
    const updated={};
    for(const k of['mon','tue','wed','thu','fri']){
      const el=document.getElementById(`rule-${k}`);
      const v=parseInt(el?.value,10);
      updated[k]=Number.isFinite(v)&&v>=0?v:DEFAULT_RULES[k];
    }
    const prev=APP.rules;
    APP.rules=updated;render();
    try{
      const res=await fetch(RULES_API_BASE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(updated)});
      if(!res.ok)throw new Error('save_failed');
      toast(t.rulesSaved);
    }catch(e){
      APP.rules=prev;render();
      toast(t.rulesSaveFail);
    }
  };

  window.resetRules=async()=>{
    const t=APP.t;
    const prev=APP.rules;
    APP.rules={...DEFAULT_RULES};render();
    try{
      const res=await fetch(RULES_API_BASE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(DEFAULT_RULES)});
      if(!res.ok)throw new Error('save_failed');
      toast(t.rulesSaved);
    }catch(e){
      APP.rules=prev;render();
      toast(t.rulesSaveFail);
    }
  };

  window.loadBookings=loadBookings;
  window.loadHolidays=loadHolidays;
  window.loadRules=loadRules;
  window.retryLoadBookings=async()=>{
    APP.bookingsLoadError=false;APP.holidaysLoadError=false;APP.rulesLoadError=false;render();
    await Promise.all([loadBookings(),loadHolidays(),loadRules()]);render();
  };

  window.deleteHoliday=async id=>{
    const prev=APP.holidays;
    APP.holidays=APP.holidays.filter(h=>h.id!==id);render();
    try{
      const res=await fetch(`${HOLIDAYS_API_BASE}?id=${encodeURIComponent(id)}`,{method:'DELETE'});
      if(!res.ok)throw new Error('delete_failed');
      toast(APP.t.toastBlockRemoved);
    }catch(e){
      APP.holidays=prev;render();
      toast(APP.lang==='nl'?'Verwijderen mislukt — probeer opnieuw.':'Delete failed — please try again.');
    }
  };

  window.toggleHolMode=()=>{
    const mode=document.querySelector('input[name="hol-mode"]:checked')?.value||'single';
    const single=document.getElementById('hol-single-fields');
    const range=document.getElementById('hol-range-fields');
    if(!single||!range)return;
    if(mode==='range'){single.style.display='none';range.style.display='block';}
    else{single.style.display='block';range.style.display='none';}
  };

  window.addHoliday=async()=>{
    const t=APP.t;
    const mode=document.querySelector('input[name="hol-mode"]:checked')?.value||'single';
    const name=document.getElementById('hol-name').value.trim();
    const type=document.getElementById('hol-type').value;
    if(!name){toast(t.toastHolFill);return;}

    if(mode==='range'){
      const startVal=document.getElementById('hol-start-date').value;
      const endVal=document.getElementById('hol-end-date').value;
      if(!startVal||!endVal){toast(t.toastHolFill);return;}
      const start=parseLocalDate(startVal),end=parseLocalDate(endVal);
      if(end<start){toast(t.toastHolRangeInvalid);return;}
      const items=[];
      for(let d=new Date(start);d<=end;d=addDays(d,1)){
        if(!isWeekend(d)) items.push({date:toDS(d),name,type});
      }
      if(!items.length){toast(t.toastHolRangeInvalid);return;}
      try{
        const res=await fetch(HOLIDAYS_API_BASE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items})});
        if(!res.ok)throw new Error('bulk_add_failed');
        APP.holidays=await res.json();
        APP.holSubTab='list';render();
        toast(t.toastHolRangeAdded);
      }catch(e){
        toast(APP.lang==='nl'?'Toevoegen mislukt — probeer opnieuw.':'Adding failed — please try again.');
      }
      return;
    }

    const date=document.getElementById('hol-date').value;
    if(!date){toast(t.toastHolFill);return;}
    try{
      const res=await fetch(HOLIDAYS_API_BASE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date,name,type})});
      if(!res.ok)throw new Error('add_failed');
      const created=await res.json();
      APP.holidays.push(created);
      APP.holSubTab='list';render();
    }catch(e){
      toast(APP.lang==='nl'?'Toevoegen mislukt — probeer opnieuw.':'Adding failed — please try again.');
    }
  };

  window.addDutchHols=async()=>{
    const items=DUTCH_HOL_2026.filter(h=>!APP.holidays.find(x=>x.date===h.date)).map(h=>({date:h.date,name:h.name,type:'full'}));
    if(!items.length){APP.holSubTab='list';render();return;}
    try{
      const res=await fetch(HOLIDAYS_API_BASE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items})});
      if(!res.ok)throw new Error('bulk_add_failed');
      APP.holidays=await res.json();
      APP.holSubTab='list';render();
    }catch(e){
      toast(APP.lang==='nl'?'Toevoegen mislukt — probeer opnieuw.':'Adding failed — please try again.');
    }
  };

  window.quickBlockDay=ds=>{
    const ex=APP.holidays.find(h=>h.date===ds);
    if(ex){window.quickUnblockDay(ds);return;}
    APP.modal={type:'quickblock',date:ds};render();
  };

  window.quickUnblockDay=async ds=>{
    const prev=APP.holidays;
    APP.holidays=APP.holidays.filter(h=>h.date!==ds);render();
    try{
      const res=await fetch(`${HOLIDAYS_API_BASE}?date=${encodeURIComponent(ds)}`,{method:'DELETE'});
      if(!res.ok)throw new Error('delete_failed');
      toast(APP.t.toastBlockRemoved);
    }catch(e){
      APP.holidays=prev;render();
      toast(APP.lang==='nl'?'Verwijderen mislukt — probeer opnieuw.':'Delete failed — please try again.');
    }
  };

  window.quickBlockSave=async ds=>{
    const name=document.getElementById('qb-name').value.trim()||(APP.lang==='nl'?'Geblokkeerd':'Blocked'),type=document.getElementById('qb-type').value;
    try{
      const res=await fetch(HOLIDAYS_API_BASE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:ds,name,type})});
      if(!res.ok)throw new Error('add_failed');
      const created=await res.json();
      APP.holidays.push(created);
      APP.modal=null;render();
      toast(APP.t.toastBlocked);
    }catch(e){
      APP.modal=null;render();
      toast(APP.lang==='nl'?'Blokkeren mislukt — probeer opnieuw.':'Blocking failed — please try again.');
    }
  };
  window.copyConf=(ref,address,date,slot,contact,svc)=>{
    const t=APP.t;
    const txt=`FRISSE VENTILATIE\n${t.confirmHeader.toUpperCase()}\n${t.rowRef}: ${ref}\n${t.rowDate}: ${date}\n${t.rowTime}: ${slot}\n${t.rowAddr}: ${address}\n${t.rowContact}: ${contact}\n${t.rowService}: ${svc}`;
    navigator.clipboard.writeText(txt).then(()=>toast(t.toastCopied)).catch(()=>toast(t.toastCopyFail));
  };
  window.exportCSV=()=>{
    const t=APP.t;
    const hdr=`${t.rowRef},${t.rowDate},${t.rowSlot},${t.rowAddr},${t.rowContact},${t.rowEmail},${t.rowService},${t.rowAdditional},${t.rowComments},${t.rowStatus}\n`;
    const rows=APP.bookings.map(b=>{const svc=t.serviceTypes.find(s=>s.value===b.serviceType)?.label||b.serviceType||'';return[b.ref||'',b.date,SLOTS.find(s=>s.id===b.slot)?.label,b.address,b.contact,b.email,svc,b.additionalInfo,b.comments,b.status==='approved'?t.statusConfirmed:t.statusPending].map(v=>`"${(v||'').replace(/"/g,'""')}"`).join(',');}).join('\n');
    const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(hdr+rows);a.download='afspraken.csv';a.download='afspraken.csv';a.click();
  };
}

// Load the shared agenda (bookings + holidays) from the server before the
// first render, so every visitor starts from the same real list instead of
// an empty/stale one.
(async function init(){
  const app=document.getElementById('app');
  if(app)app.innerHTML='<div style="padding:80px 20px;text-align:center;color:#616161;font-family:\'Open Sans\',system-ui,sans-serif;font-size:13px">'+(APP.lang==='nl'?'Agenda laden…':'Loading agenda…')+'</div>';
  await Promise.all([loadBookings(),loadHolidays(),loadRules()]);
  render();
})();
</script>
